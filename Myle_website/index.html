<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="My Le is a Digital Media and UX/UI design student creating playful interactive digital experiences."
    />
    <title>My Le</title>
    <link rel="icon" type="image/png" href="assets/my-le-logo-cutout.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="site-shell">
      <nav class="site-nav" data-nav></nav>

      <main>
        <section class="hero section-pad reveal">
          <div class="hero-art scrapbook-collage" data-hero-art aria-hidden="true">
            <span class="paper-note">interactive<br />media</span>
            <span class="pixel-sticker sticker-one">UX/UI</span>
            <span class="pixel-sticker sticker-two">motion</span>
            <span class="washi-tape tape-one">made for you</span>
            <span class="washi-tape tape-two"></span>
            <span class="barcode-sticker" aria-label="barcode sticker"></span>
            <span class="pattern-tape tape-checker"></span>
            <span class="pattern-tape tape-gingham"></span>
            <span class="scrapbook-star star-one"></span>
            <span class="scrapbook-star star-two"></span>
            <span class="button-sticker button-blue"></span>
            <span class="button-sticker button-heart"></span>
            <span class="button-sticker button-yellow"></span>
            <span class="sticker-bow"></span>
            <span class="sticker-cloud">dream<br />log</span>
            <img class="collage-logo" src="assets/my-le-logo-cutout.png" alt="" />
            <figure class="profile-polaroid">
              <span class="photo-corner corner-one"></span>
              <span class="photo-corner corner-two"></span>
              <span class="tama-screen">
                <img src="assets/my-profile.jpeg" alt="" />
              </span>
              <figcaption>My Le</figcaption>
            </figure>
            <figure class="collage-piece collage-piece-a">
              <img src="assets/lmu.jpg" alt="" />
            </figure>
            <figure class="collage-piece collage-piece-b">
              <img src="assets/sg.jpg" alt="" />
            </figure>
            <figure class="collage-piece collage-piece-c">
              <img src="assets/true-beauty-cover.png" alt="" />
            </figure>
            <span class="ticket-stub">My Le</span>
          </div>

          <div class="hero-text">
            <p class="hero-name">My Le</p>
            <p>UX/UI Designer + Interactive Media Designer</p>
            <p>
              I create interactive digital experiences that combine user-centred
              design, motion, sound, and playful visual systems.
            </p>
          </div>
        </section>

        <!-- Project groups are populated from js/main.js. Edit project categories there if you add or move work. -->
        <section
          class="section-pad work-section"
          id="work"
          data-project-group="ux-ui"
        ></section>
        <section
          class="section-pad work-section"
          data-project-group="animation-video"
        ></section>
      </main>

      <footer class="site-footer">
        <span>My Le · Digital Media / UX/UI Design</span>
        <span>Melbourne · 2026</span>
      </footer>
    </div>
    <script src="js/main.js?v=20260601-sparkles"></script>
  </body>
</html>
